# Scientific facets of each investigation, used for query-aware ranking explanations and the
# deterministic evidence assessment (backend/src/embernova/science/assessment.py).
#
# Format: facet -> {value: basis_keyword}. The basis keyword MUST occur (case-insensitive) in
# that investigation's NASA title/objectives/approach/hardware/platform metadata or in its own
# ingested NASA document text. backend/tests/test_facets.py enforces this. A facet that is absent
# means "not recorded in curated metadata" (unknown), never "confirmed absent".
#
# environment: microgravity (orbital flight), simulated_partial_gravity (aircraft, centrifuge,
#   rotating capsule), normal_gravity (1-g ground tests/comparisons), numerical_model, planned_lunar
# study_type: flight_experiment, ground_test, modeling, planned, sampling
# Curated by Claude Code (architect), 2026-11-13. Reviewed curation, not SI output at runtime.

