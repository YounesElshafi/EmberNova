# Fire-safety role of each investigation, used for objective filters, ranking facets
# and the Fire-safety systems view.
#
# Every tag has a checkable basis:
#   challenge: the official "Flame in Freefall" challenge text groups the investigation
#              under that role (quoted phrase in `quote`);
#   metadata:  `keyword` occurs in the investigation's NASA title, objectives or approach
#              (verified by backend/tests/test_tags.py).
# "fundamental" marks combustion science the challenge calls relevant "just not as strongly
# or directly". Tags are a reviewed curation layer, not SI output.
#
# facility follows the challenge's hardware grouping: CIR-ACME, CIR-MDCA, MSG; Cygnus for
# Saffire; ground for ground/modeling studies; planned for supplemental future experiments.

PSI-25:
  objectives: [prevention, suppression]
  facility: MSG
  basis:
    - {objective: prevention, source: challenge, quote: "Flammability studies focus on solid materials such as fabrics and plastics, as studied in the Burning and Suppression of Solids (BASS and BASS-II)"}
    - {objective: suppression, source: metadata, keyword: suppression}
