# /etc/nginx/conf.d/embernova-limits.conf (http context): abuse protection for the EmberNova API.
# The application also enforces a daily SI budget and a per-visitor hourly research-turn limit.
limit_req_zone $binary_remote_addr zone=embernova_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=embernova_turns:10m rate=6r/m;
