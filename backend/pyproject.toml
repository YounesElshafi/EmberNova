[project]
name = "embernova"
version = "0.1.0"
description = "Evidence-grounded NASA combustion research workspace (SI-assisted implementation)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "openai>=2,<3",
    "pandas>=2.2,<3",
    "numpy>=2,<3",
    "jsonschema>=4.23,<5",
    "pyarrow>=19,<24",
    "duckdb>=1.2,<2",
    "pint>=0.24,<1",
    "pyyaml>=6,<7",
    "python-ulid>=3,<4",
    "tiktoken>=0.9,<1",
    "pymupdf>=1.25,<2",
    "pillow>=11,<13",
    "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
embernova-build = "embernova.ingest.build:main"
embernova-eval = "embernova.evaluation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
